name: Daily Jira Alerts

on:
  schedule:
    - cron: '0 7 * * 1-5'  # 10:00 AM Israel time (UTC+3), weekdays only
  workflow_dispatch:         # Allow manual trigger from GitHub UI

jobs:
  send-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send real alerts (PMN + PMSTND)
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TEAMS_FLOW_URL: ${{ secrets.TEAMS_FLOW_URL }}
        run: |
          python main.py --run-once --project PMN --project PMSTND

      - name: Send managerial summary to all subscribers
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TEAMS_FLOW_URL: ${{ secrets.TEAMS_FLOW_URL }}
        run: |
          python main.py --managerial-summary --project PMN --project PMSTND
