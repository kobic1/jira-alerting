name: Daily Jira Alerts

on:
  schedule:
    # GitHub delays scheduled runs 2-4h, and the top of the hour is the least
    # reliable slot. Fire early and off-the-hour so the (delayed) run still lands
    # ~09:00-11:00 UTC = 12:00-14:00 Israel. Keep this to a SINGLE entry —
    # multiple crons would trigger multiple runs and duplicate every alert.
    - cron: '20 4 * * 1-5'  # ~07:20 Israel nominal, weekdays only
  workflow_dispatch:         # Allow manual trigger from GitHub UI

concurrency:
  group: daily-alerts
  cancel-in-progress: true   # if a second run starts while first is running, cancel the second

jobs:
  send-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send real alerts (PMN + PMSTND)
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TEAMS_FLOW_URL: ${{ secrets.TEAMS_FLOW_URL }}
          SNOOZE_FLOW_URL: ${{ secrets.SNOOZE_FLOW_URL }}
        run: |
          python main.py --run-once --project PMN --project PMSTND

      - name: Send managerial summary to all subscribers
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TEAMS_FLOW_URL: ${{ secrets.TEAMS_FLOW_URL }}
          SNOOZE_FLOW_URL: ${{ secrets.SNOOZE_FLOW_URL }}
        run: |
          python main.py --managerial-summary --project PMN --project PMSTND

      - name: Send managerial summary (CXSUP + CXWFM)
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TEAMS_FLOW_URL: ${{ secrets.TEAMS_FLOW_URL }}
          SNOOZE_FLOW_URL: ${{ secrets.SNOOZE_FLOW_URL }}
        run: |
          python main.py --managerial-summary --project CXSUP --project CXWFM

      - name: Get today's date (for WFM dedup key)
        id: today
        run: echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Check if WFM alert already sent today
        id: wfm-dedup
        uses: actions/cache@v4
        with:
          path: .wfm-sent
          key: wfm-sent-${{ steps.today.outputs.date }}

      - name: Send WFM Org — Completed Epics Awaiting Closure
        if: steps.wfm-dedup.outputs.cache-hit != 'true'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TEAMS_FLOW_URL: ${{ secrets.TEAMS_FLOW_URL }}
          SNOOZE_FLOW_URL: ${{ secrets.SNOOZE_FLOW_URL }}
        run: |
          python wfm_completed_epics_view.py \
            kobi.cohen@nice.com \
            idan.kaizerman@nice.com \
            yoav.shulman@nice.com \
            --skip-if-empty
          date -u +%Y-%m-%d > .wfm-sent
