name: Release Status Emails

# Emails the release-status KPI dashboards. Runs on GitHub's cloud — independent of
# anyone's computer being switched on, and with no browser or interactive sign-in
# anywhere in the pipeline: every figure, EDCT included, comes from the Jira REST API.
#
# One daily cron drives all three. Each config declares its own cadence:
# manager_send_days (Mon & Thu) is when the distribution list gets it, and
# daily_personal_copy sends Kobi his own copy on the other five days (PMN only).
# On a day a dashboard is not due, its job exits cleanly having sent nothing.
#
#   PMN       (Performance Management Native) -> PMN_DASHBOARD_RECIPIENTS
#   CXCO      (CXone Coaching)                -> CXCO_DASHBOARD_RECIPIENTS
#   ASCENDERS (PMN, Ascenders/Wallboards team) -> ASCENDERS_DASHBOARD_RECIPIENTS
#
# The Ascenders job is a team-scoped cut of PMN, including its own EDCT — team-scoped
# cycle time is not available from the Power BI page at all, only from the changelog.
#
# The three dashboards run as independent matrix jobs: if one fails, the others still
# send. Nothing is emailed unless dashboards/verify_data.py passes: per-section
# freshness, the current month present in every monthly series, and every AI/EDCT
# figure reconciled against the committed Power BI snapshot. A failure fails the job
# rather than sending a wrong dashboard. The snapshot is now only a reconciliation
# baseline — no chart reads its numbers.

on:
  schedule:
    # Daily 05:00 UTC = 08:00 Israel. GitHub can delay scheduled runs by a few hours
    # under load — this is a digest, so that is acceptable. Which audience actually
    # receives it on a given day is decided per-config by --audience auto.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      audience:
        description: 'Who receives it'
        type: choice
        default: test-kobi-only
        options:
          - test-kobi-only
          - send-to-managers
          - build-only
          - auto-as-scheduled
      project:
        description: 'Which dashboard(s)'
        type: choice
        default: all
        options:
          - all
          - pmn
          - cxco
          - ascenders

jobs:
  dashboard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one project failing must not cancel the other
      matrix:
        project: [pmn, cxco, ascenders]
    name: ${{ matrix.project }}
    steps:
      - name: Skip project not selected for this manual run
        id: gate
        env:
          WANTED: ${{ github.event.inputs.project }}
        run: |
          WANTED="${WANTED:-all}"
          if [ "$WANTED" != "all" ] && [ "$WANTED" != "${{ matrix.project }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Manual run selected '$WANTED' — skipping ${{ matrix.project }}."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r dashboards/requirements.txt

      - name: Check the send secrets exist
        # Fail loudly and early rather than after a full build. A missing flow URL is
        # the one thing that silently turns a scheduled send into a no-op.
        if: steps.gate.outputs.run == 'true' && github.event.inputs.audience != 'build-only'
        continue-on-error: false
        env:
          FLOW_URL: ${{ secrets.POWER_AUTOMATE_EMAIL_URL }}
          PMN_RCPT: ${{ secrets.PMN_DASHBOARD_RECIPIENTS }}
          CXCO_RCPT: ${{ secrets.CXCO_DASHBOARD_RECIPIENTS }}
          ASC_RCPT: ${{ secrets.ASCENDERS_DASHBOARD_RECIPIENTS }}
        run: |
          MISSING=""
          [ -n "$FLOW_URL" ] || MISSING="$MISSING POWER_AUTOMATE_EMAIL_URL"
          case "${{ matrix.project }}" in
            pmn)  [ -n "$PMN_RCPT" ]  || MISSING="$MISSING PMN_DASHBOARD_RECIPIENTS" ;;
            cxco) [ -n "$CXCO_RCPT" ] || MISSING="$MISSING CXCO_DASHBOARD_RECIPIENTS" ;;
            ascenders) [ -n "$ASC_RCPT" ] || MISSING="$MISSING ASCENDERS_DASHBOARD_RECIPIENTS" ;;
          esac
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repo secret(s):$MISSING — set them in Settings → Secrets and variables → Actions. Nothing was sent."
            exit 1
          fi
          echo "Send secrets present."

      - name: Build, verify and send the ${{ matrix.project }} dashboard
        if: steps.gate.outputs.run == 'true'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          POWER_AUTOMATE_EMAIL_URL: ${{ secrets.POWER_AUTOMATE_EMAIL_URL }}
          PMN_DASHBOARD_RECIPIENTS: ${{ secrets.PMN_DASHBOARD_RECIPIENTS }}
          CXCO_DASHBOARD_RECIPIENTS: ${{ secrets.CXCO_DASHBOARD_RECIPIENTS }}
          ASCENDERS_DASHBOARD_RECIPIENTS: ${{ secrets.ASCENDERS_DASHBOARD_RECIPIENTS }}
          PMN_DASHBOARD_TEST_RECIPIENT: ${{ secrets.PMN_DASHBOARD_TEST_RECIPIENT }}
          INPUT_AUDIENCE: ${{ github.event.inputs.audience }}
        run: |
          # Scheduled (cron) runs carry no input and use 'auto', which lets each config
          # decide today's audience. Manual runs default to the Kobi-only test copy.
          case "${INPUT_AUDIENCE:-}" in
            send-to-managers)   AUDIENCE=managers ;;
            build-only)         AUDIENCE=none ;;
            test-kobi-only)     AUDIENCE=test ;;
            auto-as-scheduled)  AUDIENCE=auto ;;
            "")                 AUDIENCE=auto ;;
            *)                echo "Unknown audience '$INPUT_AUDIENCE'" >&2; exit 1 ;;
          esac
          echo "Project: ${{ matrix.project }} · Audience: $AUDIENCE"
          python dashboards/build_and_send.py \
            --config "config_${{ matrix.project }}.json" \
            --audience "$AUDIENCE"

      - name: Upload the built dashboard
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-dashboard-${{ github.run_id }}
          path: |
            dashboards/build/*.html
            dashboards/build/data.json
          if-no-files-found: warn
          retention-days: 30
