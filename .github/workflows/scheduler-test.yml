name: Scheduler Test (TEMPORARY)

# TEMPORARY workflow to prove the cloud scheduler fires unattended.
# Every 5 minutes — GitHub's minimum honored interval for scheduled workflows
# (a sub-5-min cron is not reliably run). Runs PMN in PREVIEW mode → all alerts
# go to Kobi only (no real PMN engineers spammed). DELETE once the test fires.

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub minimum; temporary)
  workflow_dispatch:

jobs:
  scheduler-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preview PMN alerts to Kobi (proves cloud scheduling)
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TEAMS_FLOW_URL: ${{ secrets.TEAMS_FLOW_URL }}
        run: |
          python main.py --run-once --preview-to kobi.cohen@nice.com --project PMN
