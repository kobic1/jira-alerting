name: WFM Completed Epics Digest

# Daily (weekdays) management rollup of the "Completed Epic, Status Not Done"
# alert across the WFM-org projects, sent to Kobi + Idan + Yoav. Skips sending
# when there are no completed-but-not-Done epics (no empty pings).
# Runs on GitHub's cloud — independent of anyone's computer.

on:
  schedule:
    - cron: '30 4 * * 1-5'   # weekdays; GitHub delays scheduled runs a few hours
  workflow_dispatch:

jobs:
  wfm-completed-epics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send WFM Completed-Epics digest (skip if empty)
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TEAMS_FLOW_URL: ${{ secrets.TEAMS_FLOW_URL }}
        run: |
          python wfm_completed_epics_view.py --skip-if-empty \
            kobi.cohen@nice.com idan.kaizerman@nice.com yoav.shulman@nice.com
