name: WFM Completed Epics Digest

# Daily (weekdays) management rollup of the "Completed Epic, Status Not Done"
# alert across the WFM-org projects. Skips sending when there are none.
# Runs on GitHub's cloud — independent of anyone's computer.
#
# Review-first design:
#   • The scheduled (cron) run goes to KOBI ONLY — a review copy.
#   • Sharing with managers (Idan + Yoav) is a DELIBERATE manual trigger:
#     Actions → this workflow → "Run workflow" → audience = share-with-managers.

on:
  schedule:
    - cron: '30 4 * * 1-5'   # weekdays; GitHub delays scheduled runs a few hours
  workflow_dispatch:
    inputs:
      audience:
        description: 'Who receives the digest'
        type: choice
        default: review-kobi-only
        options:
          - review-kobi-only
          - share-with-managers

jobs:
  wfm-completed-epics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send WFM Completed-Epics digest (skip if empty)
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TEAMS_FLOW_URL: ${{ secrets.TEAMS_FLOW_URL }}
          AUDIENCE: ${{ github.event.inputs.audience }}
        run: |
          # Scheduled runs have no input → default to Kobi-only (review copy).
          if [ "$AUDIENCE" = "share-with-managers" ]; then
            RECIPIENTS="kobi.cohen@nice.com idan.kaizerman@nice.com yoav.shulman@nice.com"
          else
            RECIPIENTS="kobi.cohen@nice.com"
          fi
          echo "Audience: ${AUDIENCE:-review-kobi-only} -> $RECIPIENTS"
          python wfm_completed_epics_view.py --skip-if-empty $RECIPIENTS
