# External people registry.
#
# Each entry maps a real person to one or more roles.
#
# email            — REQUIRED for Power Automate DM delivery.
#                    Must match the person's Microsoft 365 / Teams login email.
# jira_account_id  — copy from https://nice-ce-cxone-prod.atlassian.net/rest/api/3/myself
#                    or look up any issue's assignee.accountId via the Jira API.
#                    Used to match Jira issue owners back to people here.
# roles            — drives which rules each person receives alerts for.
# role_alerts_only — when true, this person ONLY receives digests from rules that
#                    explicitly target their role (group_by: notify_role).
#                    They are silently skipped for all assignee/reporter-based rules.
#                    Use this for product managers who should only get PM-specific alerts.

